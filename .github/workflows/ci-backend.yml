name: ci-backend

# S-01b — JVM API CI (Gradle test only). Keep lean for Free Tier minutes.
# Named `ci-backend` beside `ci-frontend`. No Testcontainers matrix here.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: apps/api/**/*.gradle*
      - name: Gradle test
        run: ./gradlew test --no-daemon
