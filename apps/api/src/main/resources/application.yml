# OmniDoc API (S-01b scaffold + B-02 persistence wiring)
#
# Default profile does NOT require a live database (health + ArchUnit stay green).
# Activate local Compose DB with SPRING_PROFILES_ACTIVE=local.
#
# Free Tier RSS: prefer -Xmx256m for local/demo JVMs (bootRun default).
# I-03 owns hosted SKU PoC — do not treat 256m as a production pin.

server:
  port: ${API_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        # secure is left to the deploy profile (I-05); local FE↔API is plain http.

# B-03: browser origins allowed to send the session + CSRF cookies.
omnidoc:
  cors:
    allowed-origins: ${OMNIDOC_CORS_ORIGINS:http://localhost:3000}
  # B-05b ingestion limits (architecture.md §5.2.1 §6). Properties, not literals.
  ingestion:
    max-upload-bytes: ${OMNIDOC_INGESTION_MAX_UPLOAD_BYTES:10485760}
    parse-timeout-ms: ${OMNIDOC_INGESTION_PARSE_TIMEOUT_MS:60000}
    job-timeout-ms: ${OMNIDOC_INGESTION_JOB_TIMEOUT_MS:300000}
    lease-ms: ${OMNIDOC_INGESTION_LEASE_MS:120000}
    max-attempts: ${OMNIDOC_INGESTION_MAX_ATTEMPTS:3}
    max-drain-per-dispatch: ${OMNIDOC_INGESTION_MAX_DRAIN:64}
    sweep-initial-delay-ms: ${OMNIDOC_INGESTION_SWEEP_INITIAL_DELAY_MS:5000}
    sweep-interval-ms: ${OMNIDOC_INGESTION_SWEEP_INTERVAL_MS:15000}

spring:
  application:
    name: omnidoc-api
  servlet:
    multipart:
      # Headroom above the 10 MiB ingestion cap so the adapter — not the container —
      # produces the `too_large` port failure for a file just over the limit.
      max-file-size: 12MB
      max-request-size: 13MB
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.JdbcTemplateAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceHealthContributorAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
      - org.springframework.boot.data.jdbc.autoconfigure.DataJdbcRepositoriesAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: false

# Logging: Log4j2 (see log4j2-spring.xml). Never log BYOK keys or note bodies.
logging:
  config: classpath:log4j2-spring.xml

---
# Local Compose Postgres (apps/api/compose.yaml). Profile: local
spring:
  config:
    activate:
      on-profile: local
  autoconfigure:
    exclude: []
  datasource:
    url: ${OMNIDOC_JDBC_URL:jdbc:postgresql://localhost:5432/omnidoc}
    username: ${OMNIDOC_APP_USER:omnidoc_app}
    password: ${OMNIDOC_APP_PASSWORD:omnidoc_app_dev}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    user: ${OMNIDOC_MIGRATOR_USER:omnidoc_migrator}
    password: ${OMNIDOC_MIGRATOR_PASSWORD:omnidoc_migrator_dev}
    url: ${OMNIDOC_JDBC_URL:jdbc:postgresql://localhost:5432/omnidoc}

management:
  health:
    db:
      enabled: true
