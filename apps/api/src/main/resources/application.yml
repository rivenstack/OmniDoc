# OmniDoc API (S-01b scaffold + B-02 persistence wiring)
#
# Default profile does NOT require a live database (health + ArchUnit stay green).
# Activate local Compose DB with SPRING_PROFILES_ACTIVE=local.
#
# Free Tier RSS: prefer -Xmx256m for local/demo JVMs (bootRun default).
# I-03 owns hosted SKU PoC — do not treat 256m as a production pin.

server:
  port: ${API_PORT:8080}

spring:
  application:
    name: omnidoc-api
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.JdbcTemplateAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceHealthContributorAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
      - org.springframework.boot.data.jdbc.autoconfigure.DataJdbcRepositoriesAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: false

# Logging: Log4j2 (see log4j2-spring.xml). Never log BYOK keys or note bodies.
logging:
  config: classpath:log4j2-spring.xml

---
# Local Compose Postgres (apps/api/compose.yaml). Profile: local
spring:
  config:
    activate:
      on-profile: local
  autoconfigure:
    exclude: []
  datasource:
    url: ${OMNIDOC_JDBC_URL:jdbc:postgresql://localhost:5432/omnidoc}
    username: ${OMNIDOC_APP_USER:omnidoc_app}
    password: ${OMNIDOC_APP_PASSWORD:omnidoc_app_dev}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    user: ${OMNIDOC_MIGRATOR_USER:omnidoc_migrator}
    password: ${OMNIDOC_MIGRATOR_PASSWORD:omnidoc_migrator_dev}
    url: ${OMNIDOC_JDBC_URL:jdbc:postgresql://localhost:5432/omnidoc}

management:
  health:
    db:
      enabled: true
